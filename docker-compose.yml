version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cyclopath_backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEMO_MODE=true
      - PORT=8000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cyclopath_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
